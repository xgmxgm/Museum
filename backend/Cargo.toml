[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
argon2 = "0.6.0"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
validator = { version = "0.21.0", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
